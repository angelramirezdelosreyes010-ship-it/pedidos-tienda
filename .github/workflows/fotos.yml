name: Descargar fotos
on:
  push:
    paths: ["fotos/lista.txt", "fotos/descargar.py"]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  fotos:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Descargar y optimizar
        run: |
          pip install --quiet pillow
          python3 fotos/descargar.py
      - name: Guardar en el repositorio
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add fotos/*.jpg
          git commit -m "Fotos de productos" || exit 0
          git push
